# psmux dropped its old default of forwarding OSC 0/2 title escape sequences
# (allow-set-title changed from on to off between v3.3.2 and v3.3.3). This
# broke Copilot CLI's Windows Terminal tab title updates (e.g. via /rename)
# when running inside a psmux pane. Re-enable it and forward the raw pane
# title straight through to the outer terminal.
set -g allow-set-title on
set -g set-titles on
set -g set-titles-string "#T"

# Keep text paste detection and use one shortcut for clipboard text and images.
set -g paste-detection on
# Avoid run-shell -b: psmux 3.4.0 can fail to spawn it with an invalid handle.
bind-key -n M-v run-shell "pwsh.exe -NoProfile -STA -Command \"& ($env:MU88_DOTFILES + '/WindowsTerminal/Invoke-PsmuxClipboardPaste.ps1') -Target '#{session_name}:#{window_index}.#{pane_index}'\""
